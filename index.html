<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXCHAT</title>
<style>
:root{--side:#17212b;--bg:#0e1621;--hover:#202b36;--active:#2b5278;--line:#0a1018;--text:#f5f5f5;--muted:#7f91a4;--acc:#6ab3f3;--in:#182533;--out:#2b5278;--outT:#fff;--inp:#242f3d;--chatbg:radial-gradient(circle at 15% 20%,rgba(82,136,193,.12),transparent 45%),radial-gradient(circle at 85% 80%,rgba(106,179,243,.08),transparent 45%),#0e1621}
[data-theme=light]{--side:#fff;--bg:#fff;--hover:#f4f4f5;--active:#3390ec;--line:#e4e4e4;--text:#000;--muted:#707579;--acc:#3390ec;--in:#fff;--out:#eeffde;--outT:#000;--inp:#f4f4f5;--chatbg:linear-gradient(160deg,#dde8c4,#a8d0c4 60%,#9ec3d6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
.hidden{display:none!important}
.app{display:flex;height:100%;position:relative;overflow:hidden}
.sidebar{width:380px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:2}
.sb-top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.search{flex:1}.search input{width:100%;padding:10px 16px;border-radius:22px;background:var(--inp);border:1px solid transparent;transition:.2s}
.search input:focus{border-color:var(--acc)}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted);flex-shrink:0;transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff5c5c;border:2px solid var(--side)}
.chat-list{flex:1;overflow-y:auto;padding:0 6px 80px}
.item{display:flex;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.item:hover{background:var(--hover)}
.item.active{background:var(--active);color:#fff}.item.active small,.item.active .prev{color:rgba(255,255,255,.8)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12px}
.prev{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prev i{color:var(--acc);font-style:normal}
.badge{font-style:normal;background:#4c9ce2;color:#fff;font-size:12px;font-weight:600;min-width:21px;height:21px;padding:0 6px;border-radius:11px;display:grid;place-items:center}
.none{text-align:center;color:var(--muted);padding:30px}
.avatar{position:relative;flex-shrink:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:19px}
.avatar.sm{width:42px;height:42px;font-size:16px}.avatar.lg{width:90px;height:90px;font-size:32px}
.on{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#4dcd5e;border:2.5px solid var(--side)}
.fab{position:absolute;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;font-size:22px;color:#fff;background:#4c9ce2;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:19;animation:fade .2s}
.drawer{position:absolute;inset:0 auto 0 0;width:285px;background:var(--side);z-index:20;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.3);display:flex;flex-direction:column}
.drawer.open{transform:none}
.d-me{padding:20px 18px;background:linear-gradient(135deg,#2b5278,#4c9ce2);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.d-me .avatar{margin-bottom:8px}.d-me small{opacity:.8}
.drawer nav button{display:flex;align-items:center;gap:16px;width:100%;padding:14px 20px;text-align:left}
.drawer nav button:hover{background:var(--hover)}
.drawer nav .sw{margin-left:auto}
.d-foot{margin-top:auto;padding:16px 20px;color:var(--muted);font-size:12.5px}
.chat{flex:1;position:relative;min-width:0;display:flex;flex-direction:column;background:var(--chatbg)}
.empty{margin:auto;text-align:center;animation:fade .4s}
.empty span{background:rgba(0,0,0,.3);color:#fff;padding:6px 14px;border-radius:16px;font-size:14px}
.view{display:flex;flex-direction:column;height:100%;position:relative}
.head{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--side);border-bottom:1px solid var(--line)}
.hinfo{flex:1;min-width:0}.hinfo b{display:block;font-weight:600}.hinfo small{color:var(--muted);font-size:13px}.hinfo small.typ,.hinfo small.onl{color:var(--acc)}
.back{display:none}
.msgsearch{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--side)}
.msgsearch input{flex:1;padding:8px 14px;border-radius:18px;background:var(--inp)}.msgsearch small{color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px 8%;display:flex;flex-direction:column;gap:3px}
.msg{max-width:min(480px,80%);padding:6px 10px 6px 12px;border-radius:14px;line-height:1.38;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.18);animation:pop .18s both}
.msg.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--out);color:var(--outT);border-bottom-right-radius:4px}
.mt{float:right;margin:7px 0 -3px 12px;font-size:11px;opacity:.65;white-space:nowrap}
.out .mt{color:var(--outT)}
mark{background:#ffd75e;color:#222;border-radius:3px}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;align-items:center;gap:4px;padding:8px 12px;background:var(--side)}
.composer #text{flex:1;padding:10px 8px;min-width:0}
.send{width:42px;height:42px;font-size:22px;color:var(--acc);border-radius:50%}.send:hover{background:var(--hover)}
.emoji{position:absolute;left:10px;bottom:64px;width:300px;padding:8px;border-radius:12px;background:var(--side);display:grid;grid-template-columns:repeat(7,1fr);box-shadow:0 4px 20px rgba(0,0,0,.4);animation:pop .15s both;z-index:5}
.emoji button{font-size:22px;padding:5px;border-radius:8px}.emoji button:hover{background:var(--hover)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.overlay.out{opacity:0;transition:.18s}
.modal{width:100%;max-width:400px;max-height:90vh;overflow-y:auto;border-radius:14px;padding:20px;background:var(--side);box-shadow:0 10px 40px rgba(0,0,0,.5);animation:pop .22s both}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hint{color:var(--muted);font-size:13.5px;margin-bottom:14px;line-height:1.4}
.field{display:block;margin-bottom:14px;font-size:12.5px;color:var(--acc)}
.field input{display:block;width:100%;margin-top:5px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);color:var(--text);font-size:15px;background:var(--inp)}
.field input:focus{border-color:var(--acc)}
.center{text-align:center;margin-bottom:14px}.center .avatar{margin:0 auto 8px}.center small{color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{padding:10px 20px;border-radius:10px;font-weight:600;color:#fff;background:#4c9ce2;transition:filter .15s}.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--acc)}.btn.danger{background:#e5534b}
.set{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.sw{width:40px;height:22px;border-radius:11px;background:var(--muted);position:relative;transition:.2s;flex-shrink:0;display:inline-block;opacity:.8}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on2{background:#4c9ce2;opacity:1}.sw.on2::after{left:20px}
.nt{padding:11px 12px;border-radius:10px;background:var(--inp);margin-bottom:8px;font-size:14px}.nt small{display:block;color:var(--muted);margin-top:2px}
#toasts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{padding:11px 16px;border-radius:12px;background:#222e3a;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slide .3s both;max-width:290px;font-size:14px}
.toast.out{opacity:0;transform:translateX(30px);transition:.3s}
.skel{height:66px;margin:6px;border-radius:10px;background:linear-gradient(90deg,var(--hover),var(--inp),var(--hover));background-size:200% 100%;animation:shine 1.2s infinite}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(4px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}
@keyframes bounce{40%{transform:translateY(-5px);background:var(--acc)}}
@keyframes shine{to{background-position:-200% 0}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(127,145,164,.35);border-radius:3px}
@media(max-width:820px){
.sidebar{width:100%}
.chat{position:absolute;inset:0;z-index:3;transform:translateX(100%);transition:transform .3s}
.app.open .chat{transform:none}
.back{display:grid}.msgs{padding:12px}.msg{max-width:86%}.emoji{width:calc(100% - 20px)}}
</style>

<meta name="theme-color" content="#17212b">

<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sb-top">
      <button class="icon-btn" id="btnMenu" title="Menu">☰<i class="dot" id="notifDot"></i></button>
      <div class="search"><input id="chatSearch" placeholder="Chatlarni qidirish" autocomplete="off"></div>
    </div>
    <div class="chat-list" id="chatList"></div>
    <button class="fab" id="btnNew" title="Yangi chat">✎</button>
    <div class="drawer-bg hidden" id="dBg"></div>
    <div class="drawer" id="drawer">
      <div class="d-me" id="btnProfile"><div id="meAv"></div><b id="meName"></b><small id="meId"></small></div>
      <nav>
        <button id="mNew">👤 Yangi chat</button>
        <button id="mNotif">🔔 Bildirishnomalar</button>
        <button id="mSettings">⚙️ Sozlamalar</button>
        <button id="mTheme">🌙 Tungi rejim <span class="sw" id="swTheme"></span></button>

      </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), K = 'nexchat.v2', PID = u => 'nexchat-' + u;
const SB_URL = 'https://vtqfxjjtcjxdmtficzpo.supabase.co';
const SB_KEY = 'sb_publishable_KN_UpW4Ed_U6MmOGHfiPLw_bqVfa5HM';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const COLORS = [['#ff885e','#ff516a'],['#ffcd6a','#ffa85c'],['#82b1ff','#665fff'],['#a0de7e','#54cb68'],['#53edd6','#28c9b7'],['#72d5fd','#2a9ef1'],['#e0a2f3','#d669ed']];
const REPLIES = ['Sounds great! 👍','Haha, nice one 😄','Let me think about it…','Absolutely, count me in 🚀','That makes sense.','Wow, awesome! 🔥'];
const EMOJIS = '😀 😂 😍 🥰 😎 🤔 😢 😡 👍 👏 🙏 🔥 ✨ 🎉 ❤️ 💜 💯 🚀 🌙 ☕ 🍕 🎧 ✅ 👀 🤝 😴 🥳 🤯 😅'.split(' ');
const M = (text, out) => ({ id: uid(), text, out: !!out, t: Date.now(), st: 'd' });
const seed = () => ({ me: { name: '', bio: 'Hey there! I am using NEXCHAT', user: '' }, theme: 'dark', notify: true, autoReply: true, active: null, notifs: [],
  chats: [{ id: uid(), name: 'NEXCHAT Bot', kind: 'bot', c: 2, online: true, unread: 1, msgs: [M('Welcome to NEXCHAT! 👋'), M('Tap ✎ and enter a friend’s username to chat with a real person. I am only a demo bot.')] }] });
let S; try { S = JSON.parse(localStorage.getItem(K)) || seed(); } catch (e) { S = seed(); }
S.active = null;
let typing = null, query = '', tT = null, lastTyp = 0;
const net = { peer: null, conns: {}, tried: {}, say: null };
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const cur = () => S.chats.find(c => c.id === S.active);
const last = c => c.msgs[c.msgs.length - 1];
const tm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const ini = n => (n.replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();
const grad = i => `background:linear-gradient(180deg,${COLORS[i][0]},${COLORS[i][1]})`;
const av = (c, cls = '') => `<div class="avatar ${cls}" style="${grad(c.c)}">${esc(ini(c.name))}${c.online ? '<i class="on"></i>' : ''}</div>`;
const hl = (t, q) => { if (!q) return esc(t); let o = '', l = t.toLowerCase(), i; while ((i = l.indexOf(q)) >= 0) { o += esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>'; t = t.slice(i + q.length); l = l.slice(i + q.length); } return o + esc(t); };

function toast(text) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; $('#toasts').appendChild(t); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800); }
function modal(title, body, onMount, lock) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal"><div class="mh"><h3>${title}</h3>${lock ? '' : '<button class="icon-btn x">✕</button>'}</div>${body}</div>`;
  document.body.appendChild(o);
  const close = () => { o.classList.add('out'); setTimeout(() => o.remove(), 180); };
  if (!lock) { o.querySelector('.x').onclick = close; o.onclick = e => { if (e.target === o) close(); }; }
  if (onMount) onMount(o, close); return close;
}

// ---------- networking (Supabase persistent chat) ----------
let liveChannels = [];
function setNet(state) {
  $('#netState').textContent = {
    connecting: '🟡 Ulanmoqda…',
    online: '🟢 Supabase ulangan',
    offline: '🔴 Internet bilan aloqa yo‘q'
  }[state] || state;
}
function chatByConversation(id) {
  return S.chats.find(c => c.conversationId === id);
}
function addOrUpdateChat(conversationId, profile, conversation) {
  let c = chatByConversation(conversationId);
  if (!c) {
    c = {
      id: 'db_' + conversationId,
      conversationId,
      name: conversation?.is_group ? (conversation.title || 'Guruh') : (profile?.full_name || profile?.username || 'NEXCHAT user'),
      kind: 'peer',
      user: profile?.username || '',
      c: profile?.username ? profile.username.length % COLORS.length : 2,
      online: true,
      unread: 0,
      seen: 0,
      msgs: []
    };
    S.chats.unshift(c);
  } else {
    c.conversationId = conversationId;
    if (profile) {
      c.name = profile.full_name || profile.username || c.name;
      c.user = profile.username || c.user;
    }
    c.online = true;
  }
  return c;
}
function subscribeConversation(c) {
  if (!c?.conversationId || liveChannels.some(x => x.id === c.conversationId)) return;
  const channel = sb.channel('nexchat-' + c.conversationId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: 'conversation_id=eq.' + c.conversationId
    }, payload => {
      const d = payload.new;
      if (!d || !d.id || !d.content) return;
      if (c.msgs.some(m => String(m.id) === String(d.id))) return;
      const stamp = new Date(d.created_at).getTime() || Date.now();
      if (d.sender_id === S.me.authId) {
        const pending = c.msgs.find(m => m.out && m.st === 'p' && m.text === String(d.content));
        if (pending) {
          pending.id = String(d.id); pending.t = stamp; pending.st = 'd';
          save(); renderMsgs(false); renderList(); return;
        }
      }
      const incoming = {
        id: String(d.id), text: String(d.content), out: d.sender_id === S.me.authId,
        t: stamp, st: 'd'
      };
      c.msgs.push(incoming);
      if (S.active === c.id) renderMsgs();
      else if (!incoming.out) {
        c.unread = (c.unread || 0) + 1;
        if (S.notify) toast('💬 ' + c.name + ': ' + incoming.text.slice(0, 60));
        renderMe();
      }
      save(); renderList();
    })
    .subscribe();
  liveChannels.push({ id: c.conversationId, channel });
}
async function loadMessages(c) {
  if (!c?.conversationId) return;
  const { data, error } = await sb.from('messages')
    .select('id,conversation_id,sender_id,content,created_at')
    .eq('conversation_id', c.conversationId)
    .order('created_at', { ascending: true })
    .limit(500);
  if (error) { toast('Xabarlarni yuklashda xatolik: ' + error.message); return; }
  c.msgs = (data || []).map(d => ({
    id: String(d.id), text: String(d.content || ''),
    out: d.sender_id === S.me.authId,
    t: new Date(d.created_at).getTime() || Date.now(), st: 'd'
  }));
  subscribeConversation(c);
  save();
  if (S.active === c.id) renderMsgs();
  renderList();
}
async function syncChatsFromDB() {
  if (!S.me.authId) return;
  setNet('connecting');
  const { data: memberships, error: memberError } = await sb.from('conversation_members')
    .select('conversation_id,user_id')
    .eq('user_id', S.me.authId);
  if (memberError) throw memberError;
  const ids = [...new Set((memberships || []).map(x => x.conversation_id))];
  if (!ids.length) { setNet('online'); renderList(); save(); return; }

  const { data: conversations, error: convError } = await sb.from('conversations')
    .select('id,title,is_group')
    .in('id', ids);
  if (convError) throw convError;
  const { data: allMembers, error: allMemberError } = await sb.from('conversation_members')
    .select('conversation_id,user_id')
    .in('conversation_id', ids);
  if (allMemberError) throw allMemberError;

  const otherIds = [...new Set((allMembers || [])
    .filter(x => x.user_id !== S.me.authId).map(x => x.user_id))];
  let profiles = [];
  if (otherIds.length) {
    const result = await sb.from('profiles').select('id,username,full_name').in('id', otherIds);
    if (result.error) throw result.error;
    profiles = result.data || [];
  }
  const profileById = new Map(profiles.map(x => [x.id, x]));
  const convById = new Map((conversations || []).map(x => [x.id, x]));
  for (const id of ids) {
    const member = (allMembers || []).find(x => x.conversation_id === id && x.user_id !== S.me.authId);
    addOrUpdateChat(id, profileById.get(member?.user_id), convById.get(id));
  }
  const { data: messages, error: messagesError } = await sb.from('messages')
    .select('id,conversation_id,sender_id,content,created_at')
    .in('conversation_id', ids)
    .order('created_at', { ascending: true })
    .limit(2000);
  if (messagesError) throw messagesError;
  for (const c of S.chats.filter(x => x.conversationId && ids.includes(x.conversationId))) {
    c.msgs = (messages || []).filter(m => m.conversation_id === c.conversationId).map(d => ({
      id: String(d.id), text: String(d.content || ''),
      out: d.sender_id === S.me.authId,
      t: new Date(d.created_at).getTime() || Date.now(), st: 'd'
    }));
    subscribeConversation(c);
  }
  setNet('online'); save(); renderList();
  if (S.active) renderMsgs(false);
}
function startNet() {
  syncChatsFromDB().catch(e => {
    setNet('offline');
    toast('Chat server bilan aloqa: ' + (e.message || 'xatolik'));
  });
}
// ---------- rendering ----------
function renderMe() {
  $('#meAv').innerHTML = `<div class="avatar" style="${grad(5)}">${esc(ini(S.me.name || '?'))}</div>`;
  $('#meName').textContent = S.me.name; $('#meId').textContent = S.me.user ? '@' + S.me.user : '';
  $('#notifDot').classList.toggle('hidden', !S.notifs.length);
  $('#swTheme').classList.toggle('on2', S.theme === 'dark');
}
function renderList() {
  const q = $('#chatSearch').value.trim().toLowerCase();
  const list = S.chats.filter(c => c.name.toLowerCase().includes(q)).sort((a, b) => ((last(b) || {}).t || 0) - ((last(a) || {}).t || 0));
  $('#chatList').innerHTML = list.length ? list.map(c => {
    const l = last(c);
    return `<div class="item ${c.id === S.active ? 'active' : ''}" data-id="${c.id}">${av(c)}<div class="meta"><div class="row"><b>${esc(c.name)}</b><small>${l ? tm(l.t) : ''}</small></div><div class="row"><span class="prev">${typing === c.id ? '<i>typing…</i>' : l ? (l.out ? 'You: ' : '') + esc(l.text) : 'No messages yet'}</span>${c.unread ? `<em class="badge">${c.unread}</em>` : ''}</div></div></div>`;
  }).join('') : '<p class="none">No chats found</p>';
}
function renderHeader() {
  const c = cur(); if (!c) return;
  $('#hAv').innerHTML = av(c, 'sm'); $('#hName').textContent = c.name;
  const s = $('#hStatus'), t = typing === c.id;
  s.className = t ? 'typ' : c.online ? 'onl' : '';
  s.textContent = t ? 'typing…' : c.kind === 'bot' ? 'bot' : c.online ? 'online' : c.seen ? 'last seen at ' + tm(c.seen) : 'offline';
}
function renderMsgs(scroll = true) {
  const c = cur(); if (!c) return; const q = query.trim().toLowerCase(); let hits = 0;
  $('#msgs').innerHTML = c.msgs.map(x => {
    const h = hl(x.text, q); if (q && h.includes('<mark>')) hits++;
    const k = x.out ? (x.st === 'p' ? ' 🕒' : x.st === 's' ? ' ✓' : ' ✓✓') : '';
    return `<div class="msg ${x.out ? 'out' : 'in'}">${h}<span class="mt">${tm(x.t)}${k}</span></div>`;
  }).join('') + (typing === c.id ? '<div class="msg in typing"><i></i><i></i><i></i></div>' : '');
  $('#msCount').textContent = q ? hits + ' found' : '';
  if (scroll) { const el = $('#msgs'); el.scrollTop = el.scrollHeight; }
}
function openChat(id) {
  S.active = id; const c = cur(); c.unread = 0; query = '';
  $('#msInput').value = ''; $('#msBar').classList.add('hidden'); $('#emoji').classList.add('hidden');
  $('#empty').classList.add('hidden'); $('#view').classList.remove('hidden'); $('#app').classList.add('open');
  renderHeader(); renderMsgs(); renderList(); save(); if (c.kind === 'peer' && c.conversationId) loadMessages(c);
  if (innerWidth > 820) $('#text').focus();
}
function send() {
  const c = cur(), inp = $('#text'), text = inp.value.trim(); if (!c || !text) return;
  postMsg(c, text); inp.value = '';
}
async function postMsg(c, text) {
  if (c.kind === 'bot') {
    const x = { id: uid(), text, out: true, t: Date.now(), st: 'd' };
    c.msgs.push(x); renderMsgs(); renderList(); save(); reply(c); return;
  }
  if (!c.conversationId || !S.me.authId) {
    toast('Chat hali tayyor emas. Qayta urinib ko‘ring.'); return;
  }
  const tempId = 'pending_' + uid();
  const pending = { id: tempId, text, out: true, t: Date.now(), st: 'p' };
  c.msgs.push(pending); renderMsgs(); renderList(); save();
  const { data, error } = await sb.from('messages').insert({
    conversation_id: c.conversationId,
    sender_id: S.me.authId,
    content: text
  }).select('id,created_at').single();
  if (error) {
    c.msgs = c.msgs.filter(m => m.id !== tempId);
    renderMsgs(); renderList(); save();
    toast('Xabar yuborilmadi: ' + error.message);
    return;
  }
  pending.id = String(data.id);
  pending.t = new Date(data.created_at).getTime() || Date.now();
  pending.st = 'd';
  save(); renderMsgs(false); renderList();
}
function reply(c) {
  if (!S.autoReply) return;
  setTimeout(() => {
    typing = c.id; renderList(); if (S.active === c.id) { renderHeader(); renderMsgs(); }
    setTimeout(() => {
      typing = null; if (!S.chats.includes(c)) return;
      c.msgs.push(M(REPLIES[Math.floor(Math.random() * REPLIES.length)]));
      if (S.active === c.id) { renderHeader(); renderMsgs(); } else { c.unread++; if (S.notify) toast('💬 ' + c.name + ': ' + last(c).text); }
      renderList(); save();
    }, 1200 + Math.random() * 1200);
  }, 500);
}

// ---------- dialogs ----------
const UR = /^[a-z0-9_]{3,20}$/;
function onboarding() {
  const draw = (o) => {
    o.querySelector('.modal').innerHTML = `<div class="mh"><h3>NEXCHAT’ga xush kelibsiz</h3></div>
      <p class="hint">E-mail orqali ro‘yxatdan o‘ting yoki hisobingizga kiring.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0">
        <button class="btn" id="tabLogin" type="button">Kirish</button>
        <button class="btn ghost" id="tabSignup" type="button">Ro‘yxatdan o‘tish</button>
      </div>
      <label class="field">E-mail<input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
      <label class="field">Parol<input id="authPass" type="password" autocomplete="current-password" placeholder="Kamida 6 belgi" minlength="6" required></label>
      <label class="field" id="nameWrap" style="display:none">Ismingiz<input id="authName" type="text" autocomplete="name" placeholder="Ismingiz"></label>
      <button class="btn" id="authGo" style="width:100%;margin-top:14px">Kirish</button>
      <p class="hint" id="aInfo" style="margin:12px 0 0">Hisobingiz bo‘lmasa, “Ro‘yxatdan o‘tish”ni tanlang.</p>`;
    let mode = 'login';
    const info = o.querySelector('#aInfo');
    const go = o.querySelector('#authGo');
    const setMode = (m) => {
      mode = m;
      o.querySelector('#tabLogin').className = m === 'login' ? 'btn' : 'btn ghost';
      o.querySelector('#tabSignup').className = m === 'signup' ? 'btn' : 'btn ghost';
      o.querySelector('#nameWrap').style.display = m === 'signup' ? 'block' : 'none';
      o.querySelector('#authPass').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
      go.textContent = m === 'signup' ? 'Hisob yaratish' : 'Kirish';
      info.textContent = m === 'signup' ? 'Ro‘yxatdan o‘tish uchun haqiqiy e-mail va parol kiriting.' : 'E-mail va parolingiz bilan hisobingizga kiring.';
    };
    o.querySelector('#tabLogin').onclick = () => setMode('login');
    o.querySelector('#tabSignup').onclick = () => setMode('signup');
    go.onclick = async () => {
      const email = o.querySelector('#authEmail').value.trim();
      const password = o.querySelector('#authPass').value;
      const name = o.querySelector('#authName').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { info.textContent = 'To‘g‘ri e-mail manzilini kiriting.'; return; }
      if (password.length < 6) { info.textContent = 'Parol kamida 6 belgidan iborat bo‘lsin.'; return; }
      if (mode === 'signup' && !name) { info.textContent = 'Ismingizni kiriting.'; return; }
      go.disabled = true; info.textContent = 'Iltimos, kuting…';
      try {
        if (mode === 'signup') {
          const redirectTo = location.protocol === 'https:' ? location.href.split('#')[0] : undefined;
          const { data, error } = await sb.auth.signUp({
            email, password,
            options: {
              data: { full_name: name },
              ...(redirectTo ? { emailRedirectTo: redirectTo } : {})
            }
          });
          if (error) throw error;
          if (data.session?.user) {
            await activateAccount(data.session.user, name, '');
            o.remove();
          } else {
            info.textContent = 'Tasdiqlash xati e-mail manzilingizga yuborildi. Xatdagi havolani oching.';
            go.disabled = false;
          }
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          await activateAccount(data.user, data.user.user_metadata?.full_name || '', '');
          o.remove();
        }
      } catch (err) {
        info.textContent = err.message || 'Xatolik yuz berdi. Qayta urinib ko‘ring.';
        go.disabled = false;
      }
    };
  };
  modal('NEXCHAT', '<p class="hint">Yuklanmoqda…</p>', draw, true);
}
async function activateAccount(user, name, username) {
  const n = name || user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'NEXCHAT user';
  const u = username || ('user_' + user.id.replace(/-/g, '').slice(0, 10));
  S.me.name = n; S.me.user = u; S.me.authId = user.id; save();
  try {
    const { error } = await sb.from('profiles').upsert({ id: user.id, username: u, full_name: n }, { onConflict: 'id' });
    if (error) console.warn('Profile sync:', error.message);
  } catch (e) { console.warn('Profile sync:', e); }
  renderMe(); startNet();
}
async function initAuth() {
  setNet('connecting');
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    if (data.session?.user) {
      const u = data.session.user;
      await activateAccount(u, u.user_metadata?.full_name || S.me.name, u.user_metadata?.username || S.me.user);
    } else onboarding();
  } catch (e) {
    toast('Supabase bilan ulanishda xatolik: ' + (e.message || '')); onboarding();
  }
}

function newChat() {
  closeDrawer();
  modal('Yangi chat', `<p class="hint">Do‘stingizning NEXCHAT username’ini kiriting. Masalan: @user_123456</p><label class="field">Username<input id="ncUser" maxlength="21" placeholder="@username"></label><div class="acts"><button class="btn ghost x2">Bekor qilish</button><button class="btn" id="ncOk">Chatni boshlash</button></div>`, (o, close) => {
    const inp = o.querySelector('#ncUser');
    inp.focus();
    const go = async () => {
      const u = inp.value.trim().toLowerCase().replace(/^@/, '');
      if (!UR.test(u)) return toast('Username noto‘g‘ri (3–20 ta belgi).');
      if (u === S.me.user) return toast('Bu sizning username’ingiz 🙂');
      const btn = o.querySelector('#ncOk');
      btn.disabled = true; btn.textContent = 'Qidirilmoqda…';
      try {
        const { data: profile, error: pErr } = await sb.from('profiles')
          .select('id,username,full_name')
          .eq('username', u).maybeSingle();
        if (pErr) throw pErr;
        if (!profile) throw new Error('Bunday username topilmadi.');
        const { data: conversationId, error: cErr } = await sb.rpc('start_direct_conversation', { p_username: u });
        if (cErr) throw cErr;
        const id = Array.isArray(conversationId) ? conversationId[0] : conversationId;
        if (!id) throw new Error('Chat yaratilmadi. Qayta urinib ko‘ring.');
        const c = addOrUpdateChat(id, profile, { is_group: false });
        close(); save(); renderList(); openChat(c.id);
      } catch (err) {
        toast(err.message || 'Chat ochishda xatolik.');
        btn.disabled = false; btn.textContent = 'Chatni boshlash';
      }
    };
    o.querySelector('#ncOk').onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    o.querySelector('.x2').onclick = close;
  });
}
function delChat() {
  const c = cur(); if (!c) return;
  modal('Delete chat', `<p class="hint">Delete the chat with <b>${esc(c.name)}</b>? This cannot be undone.</p><div class="acts"><button class="btn ghost x2">Cancel</button><button class="btn danger" id="dOk">Delete</button></div>`, (o, close) => {
    o.querySelector('.x2').onclick = close;
    o.querySelector('#dOk').onclick = () => {
      S.chats = S.chats.filter(x => x !== c); S.active = null; save(); close();
      $('#view').classList.add('hidden'); $('#empty').classList.remove('hidden'); $('#app').classList.remove('open'); renderList(); toast('Chat deleted');
    };
  });
}
function profile() {
  closeDrawer();
  modal('Profile', `<div class="center"><div class="avatar lg" style="${grad(5)}">${esc(ini(S.me.name))}</div><small>@${esc(S.me.user)}</small></div><label class="field">Name<input id="pName" maxlength="30" value="${esc(S.me.name)}"></label><label class="field">Bio<input id="pBio" maxlength="60" value="${esc(S.me.bio)}"></label><div class="acts"><button class="btn ghost" id="pCopy">Copy username</button><button class="btn" id="pOk">Save</button></div>`, (o, close) => {
    o.querySelector('#pCopy').onclick = () => { try { navigator.clipboard.writeText(S.me.user); toast('Username copied'); } catch (e) { toast('@' + S.me.user); } };
    o.querySelector('#pOk').onclick = () => { const n = o.querySelector('#pName').value.trim(); if (!n) return toast('Name cannot be empty'); S.me.name = n; S.me.bio = o.querySelector('#pBio').value.trim(); save(); renderMe(); if (S.me.authId) sb.from('profiles').update({ full_name: n }).eq('id', S.me.authId).then(({error}) => { if (error) toast('Profil saqlanmadi: ' + error.message); }); close(); toast('Profil yangilandi ✅'); };
  });
}
function settings() {
  closeDrawer();
  const row = (id, l, on) => `<div class="set"><span>${l}</span><button class="sw ${on ? 'on2' : ''}" id="${id}"></button></div>`;
  modal('Settings', row('sTheme', '🌙 Tungi rejim', S.theme === 'dark') + row('sNotify', '🔔 Bildirishnomalar', S.notify) + row('sAuto', '🤖 Bot avtomatik javoblari', S.autoReply) + `<div class="acts" style="margin-top:16px;flex-wrap:wrap"><button class="btn ghost" id="sLogout">Hisobdan chiqish</button><button class="btn danger" id="sReset">Reset all data</button></div>`, o => {
    const tog = (id, fn) => o.querySelector(id).onclick = e => { e.currentTarget.classList.toggle('on2'); fn(e.currentTarget.classList.contains('on2')); save(); };
    tog('#sTheme', v => { S.theme = v ? 'dark' : 'light'; applyTheme(); renderMe(); });
    tog('#sNotify', v => { S.notify = v; }); tog('#sAuto', v => { S.autoReply = v; });
    o.querySelector('#sLogout').onclick = async () => { const { error } = await sb.auth.signOut(); if (error) return toast(error.message); location.reload(); };
    o.querySelector('#sReset').onclick = () => { localStorage.removeItem(K); location.reload(); };
  });
}
function notifs() {
  closeDrawer();
  modal('Notifications', S.notifs.length ? S.notifs.slice(0, 30).map(n => `<div class="nt">${esc(n.text)}<small>${tm(n.t)}</small></div>`).join('') + '<div class="acts"><button class="btn ghost" id="nClear">Clear all</button></div>' : '<p class="none">No notifications</p>', (o, close) => {
    const b = o.querySelector('#nClear'); if (b) b.onclick = () => { S.notifs = []; save(); renderMe(); close(); };
  });
}
function applyTheme() { document.documentElement.dataset.theme = S.theme; }
const openDrawer = () => { $('#drawer').classList.add('open'); $('#dBg').classList.remove('hidden'); };
function closeDrawer() { $('#drawer').classList.remove('open'); $('#dBg').classList.add('hidden'); }

// ---------- events ----------
$('#chatList').onclick = e => { const it = e.target.closest('.item'); if (it) openChat(it.dataset.id); };
$('#chatSearch').oninput = renderList;
$('#btnMenu').onclick = openDrawer; $('#dBg').onclick = closeDrawer;
$('#btnNew').onclick = $('#mNew').onclick = newChat;
$('#btnProfile').onclick = profile; $('#mSettings').onclick = settings; $('#mNotif').onclick = notifs;
$('#mTheme').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); renderMe(); save(); };
$('#btnDel').onclick = delChat;
$('#btnBack').onclick = () => $('#app').classList.remove('open');
$('#btnSend').onclick = send;
$('#text').onkeydown = e => { if (e.key === 'Enter') send(); };
$('#text').oninput = () => {};
$('#btnMsgSearch').onclick = () => { const b = $('#msBar'); b.classList.toggle('hidden'); query = ''; $('#msInput').value = ''; renderMsgs(); if (!b.classList.contains('hidden')) $('#msInput').focus(); };
$('#msInput').oninput = e => { query = e.target.value; renderMsgs(false); };
$('#btnEmoji').onclick = e => { e.stopPropagation(); $('#emoji').classList.toggle('hidden'); };
$('#emoji').innerHTML = EMOJIS.map(x => `<button>${x}</button>`).join('');
$('#emoji').onclick = e => { if (e.target.tagName === 'BUTTON') { $('#text').value += e.target.textContent; $('#text').focus(); } };
document.addEventListener('click', e => { if (!e.target.closest('#emoji')) $('#emoji').classList.add('hidden'); });
$('#btnAttach').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0], c = cur(); if (!f || !c) return; toast('Fayl yuborish keyingi bosqichda ulanadi. Hozircha matnli xabar yuborishingiz mumkin.'); e.target.value = ''; };
window.addEventListener('online', () => startNet());

// ---------- boot ----------
applyTheme(); renderMe();
$('#chatList').innerHTML = '<div class="skel"></div>'.repeat(6);
setTimeout(renderList, 600);
initAuth();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>

<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXCHAT — Premium Messenger</title>
<style>

:root{
 --bg:#0b1020;--panel:#111a2d;--panel2:#151f35;--surface:#19243b;--hover:#202d48;
 --line:rgba(148,163,184,.13);--text:#edf3ff;--muted:#8b9ab5;--acc:#8b9cff;
 --acc2:#62d6c7;--in:#1a2740;--out:#5366c9;--outT:#fff;--inp:#0e172a;
 --chatbg:radial-gradient(ellipse at 15% 12%,rgba(93,111,220,.13),transparent 42%),radial-gradient(ellipse at 85% 85%,rgba(42,190,173,.08),transparent 40%),#0b1020;
 --shadow:0 18px 50px rgba(0,0,0,.22);--neu1:#202c43;--neu2:#080d18;
}
[data-theme=light]{
 --bg:#edf1f8;--panel:#f7f9fd;--panel2:#eef2f9;--surface:#e8edf6;--hover:#e2e8f2;
 --line:rgba(59,75,110,.13);--text:#202a42;--muted:#78849b;--acc:#586de0;
 --acc2:#159d91;--in:#f7f9fd;--out:#dce4ff;--outT:#27345e;--inp:#e9eef7;
 --chatbg:radial-gradient(ellipse at 15% 12%,rgba(88,109,224,.10),transparent 42%),radial-gradient(ellipse at 85% 85%,rgba(21,157,145,.08),transparent 40%),#edf1f8;
 --shadow:0 18px 50px rgba(45,60,90,.12);--neu1:#fff;--neu2:#cbd3e1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
.hidden{display:none!important}
.app{display:flex;height:100%;min-height:0;position:relative;overflow:hidden;padding:14px;gap:14px;background:var(--bg)}
.sidebar{width:292px;flex:0 0 292px;background:var(--panel);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:2;box-shadow:var(--shadow);transition:width .28s ease,flex-basis .28s ease}
.sidebar.collapsed{width:88px;flex-basis:88px}
.sb-brand{height:74px;display:flex;align-items:center;gap:13px;padding:0 20px;white-space:nowrap;overflow:hidden}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;color:white;font-weight:800;font-size:17px;background:linear-gradient(145deg,#7c8cff,#48cbbd);box-shadow:0 8px 20px rgba(104,126,255,.28)}
.brand-copy{min-width:0;transition:opacity .2s}
.brand-copy b{display:block;font-size:16px;letter-spacing:.09em;font-weight:800}
.brand-copy small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;margin-top:2px}
.sb-toggle{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:var(--muted);font-size:19px;transition:.2s}
.sb-toggle:hover,.icon-btn:hover{background:var(--hover);color:var(--text)}
.collapsed .sb-brand{padding:0 24px}.collapsed .brand-copy,.collapsed .sb-toggle{display:none}
.sb-expand{display:none;margin:0 auto 12px;width:42px;height:42px;border-radius:13px;background:var(--surface);color:var(--muted)}
.collapsed .sb-expand{display:grid;place-items:center}
.sb-top{display:flex;align-items:center;gap:9px;padding:8px 15px 15px}
.search{flex:1;min-width:0;position:relative}
.search:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:22px;color:var(--muted)}
.search input{width:100%;padding:12px 13px 12px 39px;border-radius:14px;background:var(--inp);border:1px solid var(--line);transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
.collapsed .sb-top{padding:8px 16px 15px}.collapsed .search{display:none}
.section-label{padding:10px 22px 8px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.collapsed .section-label{opacity:0;height:8px;padding:0}
.chat-list{flex:1;overflow-y:auto;padding:0 10px 92px}
.item{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:16px;cursor:pointer;transition:background .18s,transform .18s;margin-bottom:4px;min-width:0}
.item:hover{background:var(--hover);transform:translateX(2px)}
.item.active{background:linear-gradient(115deg,color-mix(in srgb,var(--acc) 22%,var(--panel2)),color-mix(in srgb,var(--acc2) 9%,var(--panel2)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 23%,transparent)}
.item.active .row b{color:var(--acc)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.row b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.row small{color:var(--muted);font-size:10px;flex-shrink:0}
.prev{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prev i{color:var(--acc);font-style:normal}
.badge{font-style:normal;background:linear-gradient(135deg,#7185ff,#5acfc0);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:9px;display:grid;place-items:center}
.none{text-align:center;color:var(--muted);padding:30px 14px}
.avatar{position:relative;flex-shrink:0;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:750;color:#fff;font-size:16px;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.avatar.sm{width:42px;height:42px;border-radius:14px;font-size:14px}.avatar.lg{width:88px;height:88px;border-radius:26px;font-size:30px}
.on{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;background:#38d99a;border:3px solid var(--panel);box-shadow:0 0 0 2px color-mix(in srgb,#38d99a 20%,transparent)}
.fab{position:absolute;right:22px;bottom:22px;width:54px;height:54px;border-radius:18px;font-size:25px;color:#fff;background:linear-gradient(145deg,#8290ff,#4ebfb8);box-shadow:0 10px 24px rgba(91,113,230,.32);transition:transform .2s,box-shadow .2s;z-index:4}
.fab:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(91,113,230,.4)}
.collapsed .fab{right:17px;width:54px}
.drawer-bg{position:absolute;inset:0;background:rgba(4,8,18,.56);backdrop-filter:blur(5px);z-index:19;animation:fade .2s}
.drawer{position:absolute;inset:0 auto 0 0;width:292px;background:var(--panel);border:1px solid var(--line);border-radius:22px;z-index:20;transform:translateX(-110%);transition:transform .28s;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:none}
.d-me{padding:24px 22px;background:linear-gradient(135deg,#5368d1,#36a99f);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.d-me .avatar{margin-bottom:8px;border:2px solid rgba(255,255,255,.35)}.d-me small{opacity:.8}
.drawer nav{padding:12px}
.drawer nav button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;text-align:left;border-radius:12px;color:var(--muted);transition:.18s}
.drawer nav button:hover{background:var(--hover);color:var(--text)}
.drawer nav .sw{margin-left:auto}
.d-foot{margin-top:auto;padding:16px 20px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.chat{flex:1;position:relative;min-width:0;display:flex;flex-direction:column;background:var(--chatbg);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.empty{margin:auto;text-align:center;animation:fade .4s;max-width:340px;padding:30px}
.empty:before{content:"N";display:grid;place-items:center;margin:0 auto 22px;width:76px;height:76px;border-radius:25px;color:white;font-weight:900;font-size:32px;background:linear-gradient(145deg,#7d8dff,#49c8ba);box-shadow:0 14px 35px rgba(104,126,255,.25)}
.empty span{display:inline-block;background:var(--panel);color:var(--muted);padding:12px 18px;border:1px solid var(--line);border-radius:14px;font-size:13px}
.view{display:flex;flex-direction:column;height:100%;position:relative;min-height:0}
.head{display:flex;align-items:center;gap:12px;padding:17px 22px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);min-height:82px}
.hinfo{flex:1;min-width:0}.hinfo b{display:block;font-weight:750;font-size:14px}.hinfo small{color:var(--muted);font-size:11px;display:block;margin-top:4px}.hinfo small.typ,.hinfo small.onl{color:var(--acc2)}
.back{display:none}
.msgsearch{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.msgsearch input{flex:1;padding:10px 14px;border-radius:12px;background:var(--inp);border:1px solid var(--line)}.msgsearch small{color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:24px clamp(14px,7vw,100px);display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:min(520px,78%);padding:11px 14px;border-radius:17px;line-height:1.5;word-break:break-word;box-shadow:0 5px 15px rgba(0,0,0,.06);animation:pop .18s both;font-size:13px}
.msg.in{align-self:flex-start;background:var(--in);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.out{align-self:flex-end;background:linear-gradient(135deg,var(--out),color-mix(in srgb,var(--out) 76%,var(--acc2)));color:var(--outT);border-bottom-right-radius:5px}
.mt{float:right;margin:8px 0 -3px 14px;font-size:10px;opacity:.7;white-space:nowrap}
.out .mt{color:var(--outT)}
mark{background:#ffe08a;color:#332600;border-radius:3px}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;align-items:center;gap:8px;padding:14px 18px;background:var(--panel);border-top:1px solid var(--line)}
.composer #text{flex:1;padding:13px 16px;min-width:0;border-radius:15px;background:var(--inp);border:1px solid var(--line)}
.composer #text:focus{border-color:var(--acc)}
.icon-btn{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;color:var(--muted);flex-shrink:0;transition:background .15s,color .15s}
.send{width:44px;height:44px;font-size:20px;color:white;border-radius:15px;background:linear-gradient(145deg,#8290ff,#4ebfb8);box-shadow:0 7px 16px rgba(91,113,230,.24);transition:.2s}
.send:hover{transform:translateY(-2px);filter:brightness(1.08)}
.emoji{position:absolute;left:18px;bottom:78px;width:300px;padding:10px;border-radius:17px;background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);box-shadow:var(--shadow);animation:pop .15s both;z-index:5}
.emoji button{font-size:21px;padding:7px;border-radius:9px}.emoji button:hover{background:var(--hover)}
.overlay{position:fixed;inset:0;background:rgba(5,9,20,.66);backdrop-filter:blur(12px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.overlay.out{opacity:0;transition:.18s}
.modal{width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:26px;padding:28px;background:var(--panel);border:1px solid var(--line);box-shadow:0 28px 90px rgba(0,0,0,.3);animation:pop .22s both}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.5}
.field{display:block;margin-bottom:14px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.field input{display:block;width:100%;margin-top:7px;padding:14px 15px;border-radius:13px;border:1px solid var(--line);color:var(--text);font-size:14px;background:var(--inp);transition:.2s}
.field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 13%,transparent)}
.center{text-align:center;margin-bottom:18px}.center .avatar{margin:0 auto 10px}.center small{color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn{padding:12px 18px;border-radius:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7889ff,#4cbfb4);transition:filter .15s,transform .15s;box-shadow:0 8px 18px rgba(91,113,230,.17)}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--muted);box-shadow:none}.btn.danger{background:#d95768}
.set{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--muted);position:relative;transition:.2s;flex-shrink:0;display:inline-block;opacity:.8}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px #0002}
.sw.on2{background:#5c77e8;opacity:1}.sw.on2::after{left:21px}
.nt{padding:13px 14px;border-radius:13px;background:var(--surface);margin-bottom:8px;font-size:13px}.nt small{display:block;color:var(--muted);margin-top:4px}
#toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{padding:13px 17px;border-radius:13px;background:#18243a;color:#fff;border:1px solid #ffffff18;box-shadow:0 8px 26px rgba(0,0,0,.25);animation:slide .3s both;max-width:310px;font-size:12px}
.toast.out{opacity:0;transform:translateX(30px);transition:.3s}
.skel{height:70px;margin:7px;border-radius:15px;background:linear-gradient(90deg,var(--hover),var(--inp),var(--hover));background-size:200% 100%;animation:shine 1.2s infinite}
.auth-wrap{font-family:Inter,-apple-system,"Segoe UI",sans-serif}
.auth-brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}
.auth-brand .brand-mark{width:43px;height:43px;border-radius:15px}
.auth-brand b{font-size:16px;letter-spacing:.12em}
.auth-brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;margin-top:3px}
.auth-title{font-size:26px;letter-spacing:-.04em;font-weight:800;margin-bottom:7px;color:var(--text)}
.auth-sub{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:23px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px;background:var(--inp);border:1px solid var(--line);border-radius:14px;margin-bottom:21px}
.auth-tabs button{padding:11px;border-radius:10px;color:var(--muted);font-weight:700;font-size:12px}
.auth-tabs button.selected{background:var(--panel);color:var(--acc);box-shadow:5px 5px 12px color-mix(in srgb,var(--neu2) 45%,transparent),-4px -4px 10px color-mix(in srgb,var(--neu1) 65%,transparent)}
.auth-input{box-shadow:inset 5px 5px 10px color-mix(in srgb,var(--neu2) 45%,transparent),inset -5px -5px 10px color-mix(in srgb,var(--neu1) 65%,transparent)!important;border:1px solid transparent!important}
.auth-submit{width:100%;padding:15px;border-radius:14px;margin:5px 0 18px;font-size:13px}
.auth-foot{text-align:center;color:var(--muted);font-size:11px;line-height:1.6}
.auth-foot strong{color:var(--acc)}
#authGo:disabled{opacity:.6;cursor:wait}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}
@keyframes bounce{40%{transform:translateY(-5px);background:var(--acc)}}
@keyframes shine{to{background-position:-200% 0}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(127,145,164,.3);border-radius:8px}
@media(max-width:900px){.app{padding:0;gap:0}.sidebar{border-radius:0 20px 20px 0}.chat{border-radius:0;border-right:0;border-top:0;border-bottom:0}}
@media(max-width:820px){
 .sidebar{width:100%;flex:0 0 100%;border:0;border-radius:0;box-shadow:none}
 .sidebar.collapsed{width:100%;flex-basis:100%}
 .sb-brand{height:64px}.collapsed .brand-copy{display:block}.collapsed .sb-toggle{display:grid}
 .sb-expand{display:none!important}.collapsed .section-label{opacity:1;height:auto;padding:10px 22px 8px}
 .collapsed .sb-top{padding:8px 15px 15px}.collapsed .search{display:block}
 .chat{position:absolute;inset:0;z-index:3;transform:translateX(100%);transition:transform .3s;border-radius:0}
 .app.open .chat{transform:none}
 .back{display:grid}.msgs{padding:14px}.msg{max-width:88%}.emoji{width:calc(100% - 36px)}
 .drawer{border-radius:0 22px 22px 0}
 .modal{padding:23px 20px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

let S; try { S = JSON.parse(localStorage.getItem(K)) || seed(); } catch (e) { S = seed(); }

const grad = i => `background:linear-gradient(180deg,${COLORS[i][0]},${COLORS[i][1]})`;

const hl = (t, q) => { if (!q) return esc(t); let o = '', l = t.toLowerCase(), i; while ((i = l.indexOf(q)) >= 0) { o += esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>'; t = t.slice(i + q.length); l = l.slice(i + q.length); } return o + esc(t); };

function toast(text) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; $('#toasts').appendChild(t); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800); }
function modal(title, body, onMount, lock) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal"><div class="mh"><h3>${title}</h3>${lock ? '' : '<button class="icon-btn x">✕</button>'}</div>${body}</div>`;
  document.body.appendChild(o);
  const close = () => { o.classList.add('out'); setTimeout(() => o.remove(), 180); };
  if (!lock) { o.querySelector('.x').onclick = close; o.onclick = e => { if (e.target === o) close(); }; }
  if (onMount) onMount(o, close); return close;
}

// ---------- networking (Supabase persistent chat) ----------
let liveChannels = [];
let presenceChannel = null;
let onlineUserIds = new Set();
function refreshPresence() {
  const state = presenceChannel?.presenceState?.() || {};
  const next = new Set();
  Object.values(state).flat().forEach(p => { if (p?.user_id && p.user_id !== S.me.authId) next.add(p.user_id); });
  onlineUserIds = next;
  S.chats.forEach(c => { if (c.kind === 'peer' && c.peerUserId) c.online = onlineUserIds.has(c.peerUserId); });
  renderList();
  if (cur()) renderHeader();
}
async function startPresence() {
  if (!S.me.authId) return;
  if (presenceChannel) { try { await sb.removeChannel(presenceChannel); } catch (_) {} }
  presenceChannel = sb.channel('nexchat-presence', { config: { presence: { key: S.me.authId } } });
  presenceChannel
    .on('presence', { event: 'sync' }, refreshPresence)
    .on('presence', { event: 'join' }, refreshPresence)
    .on('presence', { event: 'leave' }, refreshPresence)
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        await presenceChannel.track({ user_id: S.me.authId, username: S.me.user, online_at: new Date().toISOString() });
        refreshPresence();
      }
    });
}

function setNet(state) {
  $('#netState').textContent = {
    connecting: '🟡 Ulanmoqda…',
    online: '🟢 Supabase ulangan',
    offline: '🔴 Internet bilan aloqa yo‘q'
  }[state] || state;
}
function chatByConversation(id) {
  return S.chats.find(c => c.conversationId === id);
}
function addOrUpdateChat(conversationId, profile, conversation) {
  let c = chatByConversation(conversationId);
  if (!c) {
    c = {
      id: 'db_' + conversationId,
      conversationId,
      name: conversation?.is_group ? (conversation.title || 'Guruh') : (profile?.full_name || profile?.username || 'NEXCHAT user'),
      kind: 'peer',
      user: profile?.username || '',
      peerUserId: profile?.id || null,
      c: profile?.username ? profile.username.length % COLORS.length : 2,
      online: profile?.id ? onlineUserIds.has(profile.id) : false,
      unread: 0,
      seen: 0,
      msgs: []
    };
    S.chats.unshift(c);
  } else {
    c.conversationId = conversationId;
    if (profile) {
      c.name = profile.full_name || profile.username || c.name;
      c.user = profile.username || c.user;
      c.peerUserId = profile.id || c.peerUserId || null;
    }
    c.online = c.peerUserId ? onlineUserIds.has(c.peerUserId) : false;
  }
  return c;
}
function subscribeConversation(c) {
  if (!c?.conversationId || liveChannels.some(x => x.id === c.conversationId)) return;
  const channel = sb.channel('nexchat-' + c.conversationId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: 'conversation_id=eq.' + c.conversationId
    }, payload => {
      const d = payload.new;
      if (!d || !d.id || !d.content) return;
      if (c.msgs.some(m => String(m.id) === String(d.id))) return;
      const stamp = new Date(d.created_at).getTime() || Date.now();
      if (d.sender_id === S.me.authId) {
        const pending = c.msgs.find(m => m.out && m.st === 'p' && m.text === String(d.content));
        if (pending) {
          pending.id = String(d.id); pending.t = stamp; pending.st = 's';
          save(); renderMsgs(false); renderList(); return;
        }
      }
      const incoming = {
        id: String(d.id), text: String(d.content), out: d.sender_id === S.me.authId,
        t: stamp, st: 's'
      };
      c.msgs.push(incoming);
      if (S.active === c.id) renderMsgs();
      else if (!incoming.out) {
        c.unread = (c.unread || 0) + 1;
        if (S.notify) toast('💬 ' + c.name + ': ' + incoming.text.slice(0, 60));
        renderMe();
      }
      save(); renderList();
    })
    .subscribe();
  liveChannels.push({ id: c.conversationId, channel });
}
async function loadMessages(c) {
  if (!c?.conversationId) return;
  const { data, error } = await sb.from('messages')
    .select('id,conversation_id,sender_id,content,created_at')
    .eq('conversation_id', c.conversationId)
    .order('created_at', { ascending: true })
    .limit(500);
  if (error) { toast('Xabarlarni yuklashda xatolik: ' + error.message); return; }
  c.msgs = (data || []).map(d => ({
    id: String(d.id), text: String(d.content || ''),
    out: d.sender_id === S.me.authId,
    t: new Date(d.created_at).getTime() || Date.now(), st: 's'
  }));
  subscribeConversation(c);
  save();
  if (S.active === c.id) renderMsgs();
  renderList();
}
async function syncChatsFromDB() {
  if (!S.me.authId) return;
  setNet('connecting');
  const { data: memberships, error: memberError } = await sb.from('conversation_members')
    .select('conversation_id,user_id')
    .eq('user_id', S.me.authId);
  if (memberError) throw memberError;
  const ids = [...new Set((memberships || []).map(x => x.conversation_id))];
  if (!ids.length) { setNet('online'); renderList(); save(); return; }

  const { data: conversations, error: convError } = await sb.from('conversations')
    .select('id,title,is_group')
    .in('id', ids);
  if (convError) throw convError;
  const { data: allMembers, error: allMemberError } = await sb.from('conversation_members')
    .select('conversation_id,user_id')
    .in('conversation_id', ids);
  if (allMemberError) throw allMemberError;

  const otherIds = [...new Set((allMembers || [])
    .filter(x => x.user_id !== S.me.authId).map(x => x.user_id))];
  let profiles = [];
  if (otherIds.length) {
    const result = await sb.from('profiles').select('id,username,full_name').in('id', otherIds);
    if (result.error) throw result.error;
    profiles = result.data || [];
  }
  const profileById = new Map(profiles.map(x => [x.id, x]));
  const convById = new Map((conversations || []).map(x => [x.id, x]));
  for (const id of ids) {
    const member = (allMembers || []).find(x => x.conversation_id === id && x.user_id !== S.me.authId);
    addOrUpdateChat(id, profileById.get(member?.user_id), convById.get(id));
  }
  const { data: messages, error: messagesError } = await sb.from('messages')
    .select('id,conversation_id,sender_id,content,created_at')
    .in('conversation_id', ids)
    .order('created_at', { ascending: true })
    .limit(2000);
  if (messagesError) throw messagesError;
  for (const c of S.chats.filter(x => x.conversationId && ids.includes(x.conversationId))) {
    c.msgs = (messages || []).filter(m => m.conversation_id === c.conversationId).map(d => ({
      id: String(d.id), text: String(d.content || ''),
      out: d.sender_id === S.me.authId,
      t: new Date(d.created_at).getTime() || Date.now(), st: 's'
    }));
    subscribeConversation(c);
  }
  setNet('online'); save(); renderList();
  if (S.active) renderMsgs(false);
}
function startNet() {
  syncChatsFromDB().catch(e => {
    setNet('offline');
    toast('Chat server bilan aloqa: ' + (e.message || 'xatolik'));
  });
}
// ---------- rendering ----------
function renderMe() {
  $('#meAv').innerHTML = `<div class="avatar" style="${grad(5)}">${esc(ini(S.me.name || '?'))}</div>`;
  $('#meName').textContent = S.me.name; $('#meId').textContent = S.me.user ? '@' + S.me.user : '';
  $('#notifDot').classList.toggle('hidden', !S.notifs.length);
  $('#swTheme').classList.toggle('on2', S.theme === 'dark');
}
function renderList() {
  const q = $('#chatSearch').value.trim().toLowerCase();
  const list = S.chats.filter(c => c.name.toLowerCase().includes(q)).sort((a, b) => ((last(b) || {}).t || 0) - ((last(a) || {}).t || 0));
  $('#chatList').innerHTML = list.length ? list.map(c => {
    const l = last(c);
    return `<div class="item ${c.id === S.active ? 'active' : ''}" data-id="${c.id}">${av(c)}<div class="meta"><div class="row"><b>${esc(c.name)}</b><small>${l ? tm(l.t) : ''}</small></div><div class="row"><span class="prev">${typing === c.id ? '<i>typing…</i>' : l ? (l.out ? 'You: ' : '') + esc(l.text) : 'No messages yet'}</span>${c.unread ? `<em class="badge">${c.unread}</em>` : ''}</div></div></div>`;
  }).join('') : '<p class="none">No chats found</p>';
}
function renderHeader() {
  const c = cur(); if (!c) return;
  $('#hAv').innerHTML = av(c, 'sm'); $('#hName').textContent = c.name;
  const s = $('#hStatus'), t = typing === c.id;
  s.className = t ? 'typ' : c.online ? 'onl' : '';
  s.textContent = t ? 'typing…' : c.kind === 'bot' ? 'bot' : c.online ? 'online' : c.seen ? 'last seen at ' + tm(c.seen) : 'offline';
}
function renderMsgs(scroll = true) {
  const c = cur(); if (!c) return; const q = query.trim().toLowerCase(); let hits = 0;
  $('#msgs').innerHTML = c.msgs.map(x => {
    const h = hl(x.text, q); if (q && h.includes('<mark>')) hits++;
    const k = x.out ? (x.st === 'p' ? ' 🕒' : ' ✓') : '';
    return `<div class="msg ${x.out ? 'out' : 'in'}">${h}<span class="mt">${tm(x.t)}${k}</span></div>`;
  }).join('') + (typing === c.id ? '<div class="msg in typing"><i></i><i></i><i></i></div>' : '');
  $('#msCount').textContent = q ? hits + ' found' : '';
  if (scroll) { const el = $('#msgs'); el.scrollTop = el.scrollHeight; }
}
function openChat(id) {
  S.active = id; const c = cur(); c.unread = 0; query = '';
  $('#msInput').value = ''; $('#msBar').classList.add('hidden'); $('#emoji').classList.add('hidden');
  $('#empty').classList.add('hidden'); $('#view').classList.remove('hidden'); $('#app').classList.add('open');
  renderHeader(); renderMsgs(); renderList(); save(); if (c.kind === 'peer' && c.conversationId) loadMessages(c);
  if (innerWidth > 820) $('#text').focus();
}
function send() {
  const c = cur(), inp = $('#text'), text = inp.value.trim(); if (!c || !text) return;
  postMsg(c, text); inp.value = '';
}
async function postMsg(c, text) {
  if (c.kind === 'bot') {
    const x = { id: uid(), text, out: true, t: Date.now(), st: 'd' };
    c.msgs.push(x); renderMsgs(); renderList(); save(); reply(c); return;
  }
  if (!c.conversationId || !S.me.authId) {
    toast('Chat hali tayyor emas. Qayta urinib ko‘ring.'); return;
  }
  const tempId = 'pending_' + uid();
  const pending = { id: tempId, text, out: true, t: Date.now(), st: 'p' };
  c.msgs.push(pending); renderMsgs(); renderList(); save();
  const { data, error } = await sb.from('messages').insert({
    conversation_id: c.conversationId,
    sender_id: S.me.authId,
    content: text
  }).select('id,created_at').single();
  if (error) {
    c.msgs = c.msgs.filter(m => m.id !== tempId);
    renderMsgs(); renderList(); save();
    toast('Xabar yuborilmadi: ' + error.message);
    return;
  }
  pending.id = String(data.id);
  pending.t = new Date(data.created_at).getTime() || Date.now();
  pending.st = 's';
  save(); renderMsgs(false); renderList();
}
function reply(c) {
  if (!S.autoReply) return;
  setTimeout(() => {
    typing = c.id; renderList(); if (S.active === c.id) { renderHeader(); renderMsgs(); }
    setTimeout(() => {
      typing = null; if (!S.chats.includes(c)) return;
      c.msgs.push(M(REPLIES[Math.floor(Math.random() * REPLIES.length)]));
      if (S.active === c.id) { renderHeader(); renderMsgs(); } else { c.unread++; if (S.notify) toast('💬 ' + c.name + ': ' + last(c).text); }
      renderList(); save();
    }, 1200 + Math.random() * 1200);
  }, 500);
}

const UR = /^[a-z0-9_]{3,20}$/;
function onboarding() {
  const draw = (o) => {
    const root = o.querySelector('.modal');
    root.classList.add('auth-wrap');
    root.innerHTML = `
      <div class="auth-brand"><div class="brand-mark">N</div><div><b>NEXCHAT</b><small>YOUR SPACE. YOUR PEOPLE.</small></div></div>

      <button class="btn auth-submit" id="authGo" type="button">Hisobga kirish&nbsp; →</button>
      <p class="auth-foot" id="aInfo">Hisobingiz bo‘lmasa, ro‘yxatdan o‘tish bo‘limini tanlang.</p>
      <p class="auth-foot" style="margin-top:16px">Davom etish orqali NEXCHAT’dan foydalanish shartlariga rozilik bildirasiz.</p>`;
    let mode = 'login';
    const info = o.querySelector('#aInfo');
    const go = o.querySelector('#authGo');
    const setMode = (m) => {
      mode = m;
      o.querySelector('#tabLogin').classList.toggle('selected', m === 'login');
      o.querySelector('#tabSignup').classList.toggle('selected', m === 'signup');
      o.querySelector('#nameWrap').style.display = m === 'signup' ? 'block' : 'none';
      o.querySelector('#authPass').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
      o.querySelector('#authTitle').textContent = m === 'signup' ? 'Hisob yarating' : 'Xush kelibsiz';
      o.querySelector('#authSub').textContent = m === 'signup' ? 'NEXCHAT hamjamiyatiga qo‘shiling va suhbatni boshlang.' : 'Yaqinlaringiz bilan tez, qulay va xavfsiz muloqot qiling.';
      go.textContent = m === 'signup' ? 'Hisob yaratish  →' : 'Hisobga kirish  →';
      info.textContent = m === 'signup' ? 'Ro‘yxatdan o‘tish uchun haqiqiy e-mail va parol kiriting.' : 'Hisobingiz bo‘lmasa, ro‘yxatdan o‘tish bo‘limini tanlang.';
    };
    o.querySelector('#tabLogin').onclick = () => setMode('login');
    o.querySelector('#tabSignup').onclick = () => setMode('signup');
    go.onclick = async () => {
      const email = o.querySelector('#authEmail').value.trim();
      const password = o.querySelector('#authPass').value;
      const name = o.querySelector('#authName').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { info.textContent = 'To‘g‘ri e-mail manzilini kiriting.'; return; }
      if (password.length < 6) { info.textContent = 'Parol kamida 6 belgidan iborat bo‘lsin.'; return; }
      if (mode === 'signup' && !name) { info.textContent = 'Ismingizni kiriting.'; return; }
      go.disabled = true; info.textContent = 'Iltimos, kuting…';
      try {
        if (mode === 'signup') {
          const redirectTo = location.protocol === 'https:' ? location.href.split('#')[0] : undefined;
          const { data, error } = await sb.auth.signUp({
            email, password,
            options: { data: { full_name: name }, ...(redirectTo ? { emailRedirectTo: redirectTo } : {}) }
          });
          if (error) throw error;
          if (data.session?.user) {
            await activateAccount(data.session.user, name, '');
            o.remove();
          } else {
            info.textContent = 'Tasdiqlash xati e-mail manzilingizga yuborildi. Xatdagi havolani oching.';
            go.disabled = false;
          }
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          await activateAccount(data.user, data.user.user_metadata?.full_name || '', '');
          o.remove();
        }
      } catch (err) {
        info.textContent = err.message || 'Xatolik yuz berdi. Qayta urinib ko‘ring.';
        go.disabled = false;
      }
    };
    o.querySelector('#authPass').onkeydown = e => { if (e.key === 'Enter') go.click(); };
  };
  modal('NEXCHAT', '<p class="hint">Yuklanmoqda…</p>', draw, true);
}
async function activateAccount(user, name, username) {
  const n = name || user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'NEXCHAT user';
  const u = username || ('user_' + user.id.replace(/-/g, '').slice(0, 10));
  S.me.name = n; S.me.user = u; S.me.authId = user.id; save();
  try {
    const { error } = await sb.from('profiles').upsert({ id: user.id, username: u, full_name: n }, { onConflict: 'id' });
    if (error) console.warn('Profile sync:', error.message);
  } catch (e) { console.warn('Profile sync:', e); }
  renderMe(); startNet(); startPresence();
}
async function initAuth() {
  setNet('connecting');
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    if (data.session?.user) {
      const u = data.session.user;
      await activateAccount(u, u.user_metadata?.full_name || S.me.name, u.user_metadata?.username || S.me.user);
    } else onboarding();
  } catch (e) {
    toast('Supabase bilan ulanishda xatolik: ' + (e.message || '')); onboarding();
  }
}

function newChat() {
  closeDrawer();
  modal('Yangi chat', `<p class="hint">Do‘stingizning NEXCHAT username’ini kiriting. Masalan: @user_123456</p><label class="field">Username<input id="ncUser" maxlength="21" placeholder="@username"></label><div class="acts"><button class="btn ghost x2">Bekor qilish</button><button class="btn" id="ncOk">Chatni boshlash</button></div>`, (o, close) => {
    const inp = o.querySelector('#ncUser');
    inp.focus();
    const go = async () => {
      const u = inp.value.trim().toLowerCase().replace(/^@/, '');
      if (!UR.test(u)) return toast('Username noto‘g‘ri (3–20 ta belgi).');
      if (u === S.me.user) return toast('Bu sizning username’ingiz 🙂');
      const btn = o.querySelector('#ncOk');
      btn.disabled = true; btn.textContent = 'Qidirilmoqda…';
      try {
        const { data: profile, error: pErr } = await sb.from('profiles')
          .select('id,username,full_name')
          .eq('username', u).maybeSingle();
        if (pErr) throw pErr;
        if (!profile) throw new Error('Bunday username topilmadi.');
        const { data: conversationId, error: cErr } = await sb.rpc('start_direct_conversation', { p_username: u });
        if (cErr) throw cErr;
        const id = Array.isArray(conversationId) ? conversationId[0] : conversationId;
        if (!id) throw new Error('Chat yaratilmadi. Qayta urinib ko‘ring.');
        const c = addOrUpdateChat(id, profile, { is_group: false });
        close(); save(); renderList(); openChat(c.id);
      } catch (err) {
        toast(err.message || 'Chat ochishda xatolik.');
        btn.disabled = false; btn.textContent = 'Chatni boshlash';
      }
    };
    o.querySelector('#ncOk').onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    o.querySelector('.x2').onclick = close;
  });
}
function delChat() {
  const c = cur(); if (!c) return;
  modal('Delete chat', `<p class="hint">Delete the chat with <b>${esc(c.name)}</b>? This cannot be undone.</p><div class="acts"><button class="btn ghost x2">Cancel</button><button class="btn danger" id="dOk">Delete</button></div>`, (o, close) => {
    o.querySelector('.x2').onclick = close;
    o.querySelector('#dOk').onclick = () => {
      S.chats = S.chats.filter(x => x !== c); S.active = null; save(); close();
      $('#view').classList.add('hidden'); $('#empty').classList.remove('hidden'); $('#app').classList.remove('open'); renderList(); toast('Chat deleted');
    };
  });
}
function profile() {
  closeDrawer();
  modal('Profile', `<div class="center"><div class="avatar lg" style="${grad(5)}">${esc(ini(S.me.name))}</div><small>@${esc(S.me.user)}</small></div><label class="field">Name<input id="pName" maxlength="30" value="${esc(S.me.name)}"></label><label class="field">Bio<input id="pBio" maxlength="60" value="${esc(S.me.bio)}"></label><div class="acts"><button class="btn ghost" id="pCopy">Copy username</button><button class="btn" id="pOk">Save</button></div>`, (o, close) => {
    o.querySelector('#pCopy').onclick = () => { try { navigator.clipboard.writeText(S.me.user); toast('Username copied'); } catch (e) { toast('@' + S.me.user); } };
    o.querySelector('#pOk').onclick = () => { const n = o.querySelector('#pName').value.trim(); if (!n) return toast('Name cannot be empty'); S.me.name = n; S.me.bio = o.querySelector('#pBio').value.trim(); save(); renderMe(); if (S.me.authId) sb.from('profiles').update({ full_name: n }).eq('id', S.me.authId).then(({error}) => { if (error) toast('Profil saqlanmadi: ' + error.message); }); close(); toast('Profil yangilandi ✅'); };
  });
}
function settings() {
  closeDrawer();
  const row = (id, l, on) => `<div class="set"><span>${l}</span><button class="sw ${on ? 'on2' : ''}" id="${id}"></button></div>`;
  modal('Settings', row('sTheme', '🌙 Tungi rejim', S.theme === 'dark') + row('sNotify', '🔔 Bildirishnomalar', S.notify) + row('sAuto', '🤖 Bot avtomatik javoblari', S.autoReply) + `<div class="acts" style="margin-top:16px;flex-wrap:wrap"><button class="btn ghost" id="sLogout">Hisobdan chiqish</button><button class="btn danger" id="sReset">Reset all data</button></div>`, o => {
    const tog = (id, fn) => o.querySelector(id).onclick = e => { e.currentTarget.classList.toggle('on2'); fn(e.currentTarget.classList.contains('on2')); save(); };
    tog('#sTheme', v => { S.theme = v ? 'dark' : 'light'; applyTheme(); renderMe(); });
    tog('#sNotify', v => { S.notify = v; }); tog('#sAuto', v => { S.autoReply = v; });
    o.querySelector('#sLogout').onclick = async () => { const { error } = await sb.auth.signOut(); if (error) return toast(error.message); location.reload(); };
    o.querySelector('#sReset').onclick = () => { localStorage.removeItem(K); location.reload(); };
  });
}
function notifs() {
  closeDrawer();
  modal('Notifications', S.notifs.length ? S.notifs.slice(0, 30).map(n => `<div class="nt">${esc(n.text)}<small>${tm(n.t)}</small></div>`).join('') + '<div class="acts"><button class="btn ghost" id="nClear">Clear all</button></div>' : '<p class="none">No notifications</p>', (o, close) => {
    const b = o.querySelector('#nClear'); if (b) b.onclick = () => { S.notifs = []; save(); renderMe(); close(); };
  });
}
function applyTheme() { document.documentElement.dataset.theme = S.theme; }
const openDrawer = () => { $('#drawer').classList.add('open'); $('#dBg').classList.remove('hidden'); };
function closeDrawer() { $('#drawer').classList.remove('open'); $('#dBg').classList.add('hidden'); }

// ---------- events ----------
$('#chatList').onclick = e => { const it = e.target.closest('.item'); if (it) openChat(it.dataset.id); };
$('#chatSearch').oninput = renderList;
$('#btnMenu').onclick = openDrawer; $('#dBg').onclick = closeDrawer;
$('#sidebarToggle').onclick = () => { $('#sidebar').classList.add('collapsed'); $('#sidebarToggle').setAttribute('aria-expanded','false'); };
$('#sidebarExpand').onclick = () => { $('#sidebar').classList.remove('collapsed'); $('#sidebarToggle').setAttribute('aria-expanded','true'); };
$('#btnNew').onclick = $('#mNew').onclick = newChat;
$('#btnProfile').onclick = profile; $('#mSettings').onclick = settings; $('#mNotif').onclick = notifs;
$('#mTheme').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); renderMe(); save(); };
$('#btnDel').onclick = delChat;
$('#btnBack').onclick = () => $('#app').classList.remove('open');
$('#btnSend').onclick = send;
$('#text').onkeydown = e => { if (e.key === 'Enter') send(); };
$('#text').oninput = () => {};
$('#btnMsgSearch').onclick = () => { const b = $('#msBar'); b.classList.toggle('hidden'); query = ''; $('#msInput').value = ''; renderMsgs(); if (!b.classList.contains('hidden')) $('#msInput').focus(); };
$('#msInput').oninput = e => { query = e.target.value; renderMsgs(false); };
$('#btnEmoji').onclick = e => { e.stopPropagation(); $('#emoji').classList.toggle('hidden'); };
$('#emoji').innerHTML = EMOJIS.map(x => `<button>${x}</button>`).join('');
$('#emoji').onclick = e => { if (e.target.tagName === 'BUTTON') { $('#text').value += e.target.textContent; $('#text').focus(); } };
document.addEventListener('click', e => { if (!e.target.closest('#emoji')) $('#emoji').classList.add('hidden'); });
$('#btnAttach').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0], c = cur(); if (!f || !c) return; toast('Fayl yuborish keyingi bosqichda ulanadi. Hozircha matnli xabar yuborishingiz mumkin.'); e.target.value = ''; };
window.addEventListener('online', () => { startNet(); startPresence(); });
window.addEventListener('offline', () => { setNet('offline'); onlineUserIds.clear(); S.chats.forEach(c => { if (c.kind === 'peer') c.online = false; }); renderList(); if (cur()) renderHeader(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me.authId && navigator.onLine) startPresence(); });

// ---------- boot ----------
applyTheme(); renderMe();
$('#chatList').innerHTML = '<div class="skel"></div>'.repeat(6);
setTimeout(renderList, 600);
initAuth();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
